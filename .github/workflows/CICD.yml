
name: To automate the infrastructure with Terraform

#Adding triggers for the workflow
on:
  push:
    branches: [ "main" ]

# This starts and group all the actions of this workflow
jobs:

  build_tag_docker_image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .      #this specifies the directory where the files and Dockerfile are located.
          push: true      #this will push the docker image to the docker hub instead of leaving it in the workflow machine and deleting afterwards
          tags: |
            ${{ secrets.DOCKER_IMAGE }}/${{ secrets.DOCKER_PROJECT }}:${{ github.sha }}
            ${{ secrets.DOCKER_IMAGE }}/${{ secrets.DOCKER_PROJECT }}:latest


  scan_docker_image:
    needs: [build_tag_docker_image]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKER_IMAGE }}/${{ secrets.DOCKER_PROJECT }}:${{ github.sha }}
          format: table
          exit-code: 1    #means that if any vulnerability is found, the workflow will fail. default is 0, which means the workflow will pass even if vulnerabilities are found.
        

  Deploy-to-aws-ECS:
      needs: [build_tag_docker_image, scan_docker_image]
      permissions:
        id-token: write
        contents: read
      runs-on: ubuntu-latest

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Configure AWS Credentials
          uses: aws-actions/configure-aws-credentials@v6.3.0
          with:
            aws-region: eu-west-2
            role-to-assume: ${{ secrets.ROLE }}

        - name: Download Existing Task Definition from AWS
          run: |
            aws ecs describe-task-definition \
            --task-definition ${{ secrets.ECS_TASK_FAMILY }} \
            --query taskDefinition > task-definition.json

        - name: Inject New Image Tag into Task Definition
          id: render-task-def
          uses: aws-actions/amazon-ecs-render-task-definition@v1
          with:
            task-definition: task-definition.json
            container-name: ${{ secrets.ECS_CONTAINER_NAME }}
            image: ${{ secrets.DOCKER_IMAGE }}/${{ secrets.DOCKER_PROJECT }}:${{ github.sha }}

        - name: Trigger Rolling Update on Existing ECS Service
          uses: aws-actions/amazon-ecs-deploy-task-definition@v2
          with:
            task-definition: ${{ steps.render-task-def.outputs.task-definition }}
            service: ${{ secrets.ECS_SERVICE_NAME }}
            cluster: ${{ secrets.ECS_CLUSTER_NAME }}
            wait-for-service-stability: true
          
